<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAINS Digital Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Fira Code -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-start: #3b0000;
            --bg-mid: #800000;
            --bg-end: #ad000d;
            --btn-bg: #ffffff;
            --btn-text: #800000;
            --btn-border: #ff3344;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
        }

        .mono-font { font-family: 'Fira Code', monospace; }

        .tech-grid {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            animation: gridMove 45s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 50px 50px; }
        }

        #aiDatabaseCanvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }

        .beacons-btn-red {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: 2px solid var(--btn-border);
            box-shadow: 0px 6px 0px rgba(30, 0, 0, 0.8), 0 0 15px rgba(255, 51, 68, 0.3);
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.35s ease, background-color 0.3s ease;
            position: relative; overflow: hidden; outline: none;
        }

        .beacons-btn-red:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0px 9px 0px rgba(30, 0, 0, 0.9), 0 0 25px rgba(255, 100, 100, 0.6);
            background-color: #ffffff;
        }

        [data-focusable="true"]:focus,
        [data-focusable="true"].remote-focus {
            outline: 3px solid #ffd700 !important;
            outline-offset: 3px !important;
            transform: scale(1.03) translateY(-2px) !important;
            z-index: 30 !important;
        }

        .glass-panel {
            background: rgba(30, 0, 5, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 100, 100, 0.3);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #2a0000; }
        ::-webkit-scrollbar-thumb { background: #ff3344; border-radius: 4px; }
    </style>
</head>
<body class="relative flex flex-col justify-between items-center min-h-screen px-4 py-6 selection:bg-red-500 selection:text-white">

    <!-- Canvas Animation -->
    <canvas id="aiDatabaseCanvas"></canvas>
    <div class="fixed inset-0 tech-grid pointer-events-none z-0 opacity-40"></div>

    <!-- Admin Settings Gear Button (Top-Right) -->
    <div class="fixed top-4 right-4 z-40">
        <button id="openConfigBtn" onclick="openModal('adminConfigModal')" data-focusable="true" class="w-11 h-11 bg-red-950/80 hover:bg-red-800/90 text-white rounded-full flex items-center justify-center border border-red-500/50 shadow-xl backdrop-blur-md transition-all">
            <i class="fa-solid fa-gear text-lg"></i>
        </button>
    </div>

    <!-- Main Content Container -->
    <main class="w-full max-w-md mx-auto flex flex-col items-center text-center space-y-6 my-auto pt-4 pb-16 relative z-10">
        
        <!-- Logo -->
        <div class="relative group mx-auto mb-1" data-focusable="true">
            <div class="absolute -inset-1 bg-gradient-to-r from-red-500 via-rose-500 to-amber-500 rounded-3xl blur-md opacity-60"></div>
            <div class="relative w-36 h-36 sm:w-44 sm:h-44 rounded-3xl overflow-hidden border-2 border-red-200/60 bg-white/95 backdrop-blur-md flex items-center justify-center p-4 shadow-2xl">
                <div id="svgLogoFallback" class="w-full h-full flex items-center justify-center text-slate-900">
                    <svg class="w-full h-full" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <g transform="translate(18, 8) scale(0.72)">
                            <path d="M 45 5 C 20 5 5 25 5 50 C 5 75 25 95 50 95 C 65 95 75 85 85 70 C 75 55 65 45 50 45 C 35 45 25 55 25 65 C 25 72 30 78 40 78 C 30 78 20 70 20 55 C 20 35 35 20 50 20 C 65 20 75 35 85 50 C 95 65 105 80 120 80 C 135 80 145 65 145 45 C 145 20 125 5 100 5 C 80 5 70 20 60 35 C 70 45 80 55 95 55 C 110 55 120 45 120 35 C 120 28 115 22 105 22 C 115 22 125 30 125 45 C 125 60 115 70 100 70 C 85 70 75 55 65 40 C 55 20 45 5 45 5 Z" fill="url(#sainsRedGrad)"/>
                            <defs>
                                <linearGradient id="sainsRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#e60012"/>
                                    <stop offset="100%" stop-color="#800000"/>
                                </linearGradient>
                            </defs>
                        </g>
                        <text x="70" y="118" font-family="'Inter', sans-serif" font-weight="900" font-size="24" fill="#0d0d0d" text-anchor="middle">sains</text>
                    </svg>
                </div>
                <img id="displayAvatar" src="" alt="Logo" class="w-full h-full object-contain p-1 rounded-2xl hidden" onerror="handleAvatarError()">
            </div>
        </div>

        <!-- Title & Tagline -->
        <div class="space-y-2 px-2">
            <h1 id="displayTitle" class="text-xl sm:text-2xl font-extrabold tracking-tight text-white uppercase">Loading...</h1>
            <p id="displayTagline" class="text-xs sm:text-sm text-red-100/90 max-w-sm mx-auto font-light"></p>
        </div>

        <!-- Social Icons -->
        <div id="socialContainer" class="flex items-center justify-center gap-4 text-xl pt-1"></div>

        <!-- Action Links -->
        <div id="linksContainer" class="w-full space-y-4 pt-2 px-2"></div>

        <footer class="pt-6 text-xs text-red-200/60 mono-font">
            <p>© 2026 Sarawak Information Systems Sdn. Bhd.</p>
        </footer>
    </main>

    <!-- ADMIN SETTINGS MODAL (Cloud Customizer) -->
    <div id="adminConfigModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-lg rounded-3xl p-6 space-y-4 relative shadow-2xl border border-red-500/40 max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal('adminConfigModal')" data-focusable="true" class="absolute top-4 right-4 w-9 h-9 bg-red-950 rounded-full flex items-center justify-center text-white border border-red-500/40">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <h3 class="font-bold text-lg text-white flex items-center gap-2">
                <i class="fa-solid fa-sliders text-red-400"></i> Edit Site Settings (Global Sync)
            </h3>

            <div class="space-y-3 text-left text-xs">
                <div>
                    <label class="block text-red-200 mb-1 font-bold">Site Title</label>
                    <input type="text" id="cfgTitle" class="w-full bg-black/60 border border-red-800 rounded-xl p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-red-200 mb-1 font-bold">Tagline / Subtitle</label>
                    <input type="text" id="cfgTagline" class="w-full bg-black/60 border border-red-800 rounded-xl p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-red-200 mb-1 font-bold">Logo Image URL</label>
                    <input type="text" id="cfgAvatarUrl" placeholder="https://..." class="w-full bg-black/60 border border-red-800 rounded-xl p-2.5 text-white">
                </div>

                <hr class="border-red-900/60 my-2">
                <p class="font-bold text-white">Custom Button Links</p>
                
                <div id="adminLinksEditor" class="space-y-2"></div>

                <button onclick="addAdminLinkRow()" type="button" class="px-3 py-1.5 bg-red-900/60 hover:bg-red-800 text-white rounded-lg text-xs font-semibold">
                    <i class="fa-solid fa-plus mr-1"></i> Add New Link
                </button>
            </div>

            <div class="pt-3">
                <button onclick="saveConfigToCloud()" id="saveBtn" class="w-full py-3 bg-gradient-to-r from-red-600 to-rose-700 text-white font-extrabold rounded-xl shadow-lg hover:from-red-500 hover:to-rose-600">
                    <i class="fa-solid fa-cloud-arrow-up mr-2"></i> Save & Publish Changes To Everyone
                </button>
            </div>
        </div>
    </div>

    <script>
        // PASTE YOUR NPOINT.IO OR CLOUD API URL HERE BELOW:
        const CLOUD_JSON_URL = "https://api.npoint.io/YOUR_BIN_ID";

        let currentConfig = {
            title: "Sarawak Information Systems (SAINS)",
            tagline: "Digital Partners For Life",
            avatarUrl: "",
            socials: [
                { name: "Facebook", icon: "fa-brands fa-facebook", url: "https://www.facebook.com/sainssarawak" },
                { name: "Instagram", icon: "fa-brands fa-instagram", url: "https://www.instagram.com/sainssarawak" },
                { name: "Globe", icon: "fa-solid fa-globe", url: "https://www.sains.com.my" }
            ],
            links: [
                { id: "1", title: "Official SAINS Portal", url: "https://www.sains.com.my", type: "external" },
                { id: "2", title: "Connect with Digital Tech Hub", url: "mailto:corpscom@sains.com.my", type: "external" }
            ]
        };

        window.onload = async function() {
            await loadConfigFromCloud();
            initAiDatabaseCanvasAnimation();
        };

        async function loadConfigFromCloud() {
            try {
                if (CLOUD_JSON_URL.includes("YOUR_BIN_ID")) {
                    console.log("Using local default state. Add your npoint.io API URL to enable cloud sync across all visitors.");
                    renderHubContent();
                    return;
                }
                const res = await fetch(CLOUD_JSON_URL);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.title) currentConfig = data;
                }
            } catch (err) {
                console.error("Cloud load error:", err);
            }
            renderHubContent();
        }

        async function saveConfigToCloud() {
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Saving...';

            currentConfig.title = document.getElementById('cfgTitle').value;
            currentConfig.tagline = document.getElementById('cfgTagline').value;
            currentConfig.avatarUrl = document.getElementById('cfgAvatarUrl').value;

            // Read edited links
            const linkRows = document.querySelectorAll('.admin-link-row');
            currentConfig.links = [];
            linkRows.forEach((row, i) => {
                const title = row.querySelector('.link-title-input').value;
                const url = row.querySelector('.link-url-input').value;
                if (title) {
                    currentConfig.links.push({ id: `link-${i}`, title, url, type: 'external' });
                }
            });

            try {
                if (!CLOUD_JSON_URL.includes("YOUR_BIN_ID")) {
                    await fetch(CLOUD_JSON_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(currentConfig)
                    });
                }
                renderHubContent();
                closeModal('adminConfigModal');
                alert('Changes saved globally! Every visitor now sees the updated site.');
            } catch (err) {
                alert('Error publishing changes: ' + err.message);
            } finally {
                saveBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up mr-2"></i> Save & Publish Changes To Everyone';
            }
        }

        function renderHubContent() {
            document.getElementById('displayTitle').innerText = currentConfig.title;
            document.getElementById('displayTagline').innerText = currentConfig.tagline;

            const avatarImg = document.getElementById('displayAvatar');
            const svgFallback = document.getElementById('svgLogoFallback');
            if (currentConfig.avatarUrl && currentConfig.avatarUrl.trim() !== '') {
                avatarImg.src = currentConfig.avatarUrl;
                avatarImg.classList.remove('hidden');
                svgFallback.classList.add('hidden');
            } else {
                avatarImg.classList.add('hidden');
                svgFallback.classList.remove('hidden');
            }

            document.getElementById('socialContainer').innerHTML = currentConfig.socials.map(s => `
                <a href="${s.url}" target="_blank" data-focusable="true" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 border border-red-300/30 flex items-center justify-center text-white transition-all">
                    <i class="${s.icon}"></i>
                </a>
            `).join('');

            document.getElementById('linksContainer').innerHTML = currentConfig.links.map(link => `
                <button onclick="window.open('${link.url}', '_blank')" data-focusable="true" class="beacons-btn-red w-full py-3.5 px-6 rounded-2xl flex items-center justify-center text-center">
                    <h3 class="font-extrabold text-sm sm:text-base">${link.title}</h3>
                </button>
            `).join('');

            populateAdminModalInputs();
        }

        function populateAdminModalInputs() {
            document.getElementById('cfgTitle').value = currentConfig.title || '';
            document.getElementById('cfgTagline').value = currentConfig.tagline || '';
            document.getElementById('cfgAvatarUrl').value = currentConfig.avatarUrl || '';

            const container = document.getElementById('adminLinksEditor');
            container.innerHTML = currentConfig.links.map(link => `
                <div class="admin-link-row flex gap-2 items-center">
                    <input type="text" value="${link.title}" placeholder="Button Title" class="link-title-input w-1/2 bg-black/60 border border-red-800 rounded-lg p-2 text-white">
                    <input type="text" value="${link.url}" placeholder="URL Destination" class="link-url-input w-1/2 bg-black/60 border border-red-800 rounded-lg p-2 text-white">
                    <button onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-200 p-1"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        function addAdminLinkRow() {
            const container = document.getElementById('adminLinksEditor');
            const div = document.createElement('div');
            div.className = 'admin-link-row flex gap-2 items-center';
            div.innerHTML = `
                <input type="text" placeholder="Button Title" class="link-title-input w-1/2 bg-black/60 border border-red-800 rounded-lg p-2 text-white">
                <input type="text" placeholder="URL Destination" class="link-url-input w-1/2 bg-black/60 border border-red-800 rounded-lg p-2 text-white">
                <button onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-200 p-1"><i class="fa-solid fa-trash"></i></button>
            `;
            container.appendChild(div);
        }

        function handleAvatarError() {
            document.getElementById('displayAvatar').classList.add('hidden');
            document.getElementById('svgLogoFallback').classList.remove('hidden');
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function initAiDatabaseCanvasAnimation() {
            const canvas = document.getElementById('aiDatabaseCanvas');
            const ctx = canvas.getContext('2d');
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            resize(); window.addEventListener('resize', resize);
            const nodes = Array.from({ length: 30 }, () => ({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.8, vy: (Math.random() - 0.5) * 0.8, radius: 2
            }));
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                nodes.forEach(n => {
                    n.x += n.vx; n.y += n.vy;
                    if (n.x < 0 || n.x > canvas.width) n.vx *= -1;
                    if (n.y < 0 || n.y > canvas.height) n.vy *= -1;
                    ctx.beginPath(); ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ff3344'; ctx.fill();
                });
                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>
